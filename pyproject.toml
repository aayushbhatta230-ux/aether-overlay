[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-overlay"
version = "0.2.0"
description = "Ambient, local-first AI overlay that surfaces discreet desktop suggestions on Windows"
readme = "README.md"
authors = [{ name = "Aayush Bhatta" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["windows", "ollama", "local-first", "automation", "overlay", "assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
# The core runs on the standard library alone. These unlock richer context.
win = [
    "pywin32>=306; sys_platform == 'win32'",
    "pygetwindow>=0.0.9; sys_platform == 'win32'",
    "pyperclip>=1.8.2",
    "psutil>=5.9.8",
]
llm = ["ollama>=0.3.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/aayushbhatta230-ux/aether-overlay"
Issues = "https://github.com/aayushbhatta230-ux/aether-overlay/issues"

[project.scripts]
aether = "aether.cli:main"

[tool.setuptools.packages.find]
include = ["aether*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
